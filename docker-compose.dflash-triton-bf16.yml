services:
  vllm-dflash-triton:
    # DFlash + TRITON_ATTN + BF16 KV(aeon イメージ v0.25.1)。計測結果の記録は無い。
    # fp8 版(docker-compose.dflash-triton-fp8.yml)が起動しない場合に、TRITON_ATTN 単体の効果を
    # fp8 KV と切り離して見るための構成。ホストのポート 8001 を使う(8000 のサーバと並べて起動できる)。
    # drafter は ${MODELS_DIR}/Qwen3.6-35B-A3B-DFlash-ja(zan/Qwen3.6-35B-A3B-DFlash-ja)。
    # レシピ: イメージ作者(AEON-7)の 35B-A3B 向け(method:dflash, num_spec=11)
    image: ghcr.io/aeon-7/aeon-vllm-ultimate:2026-07-16-v0.25.1
    container_name: vllm-dflash-triton
    entrypoint: ["vllm"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_CUDA_ARCH_LIST=12.1a
      - CUTE_DSL_ARCH=sm_121a
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${MODELS_DIR:-~/models}:/models
      - ./.cache/flashinfer-dflash:/root/.cache/flashinfer
      - ./.cache/vllm-dflash:/root/.cache/vllm
    ports:
      - "127.0.0.1:8001:8000"
    ipc: host
    ulimits:
      memlock: {soft: -1, hard: -1}
    command:
      - serve
      - nvidia/Qwen3.6-35B-A3B-NVFP4
      - --served-model-name=Qwen/Qwen3.6-35B-A3B
      - --tensor-parallel-size=1
      - --max-model-len=131072           # BF16 KV は容量を食うので 131072(fp8 版では 229376)
      - --max-num-seqs=8                  # ベースラインと揃える(コミュニティ投稿は 16)
      - --gpu-memory-utilization=0.44     # ベースラインと同じ 0.44 に固定して比較する
      - --max-num-batched-tokens=32768
      - --trust-remote-code
      - --host=0.0.0.0
      - --port=8000
      - --dtype=auto
      - --kv-cache-dtype=auto            # BF16 KV(fp8 と切り離して TRITON_ATTN 単体の効果を見る)
      - --attention-backend=TRITON_ATTN  # コミュニティ投稿(NeoAi)で動いたとされるバックエンド
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --async-scheduling
      - --reasoning-parser=qwen3
      - --speculative-config={"method":"dflash","model":"/models/Qwen3.6-35B-A3B-DFlash-ja","num_speculative_tokens":11,"attention_backend":"TRITON_ATTN"}
    restart: "no"
