# 参考: Qwen3.6-27B NVFP4 の起動構成。計測レポートは無い。
# 使ったときの .env は MAX_MODEL_LEN=262144 / MAX_NUM_SEQS=8 / GPU_MEMORY_UTILIZATION=0.85 /
# MAX_NUM_BATCHED_TOKENS=8192(35B 用の値とは util が違うので注意)。
services:
  vllm27b:
    # 35B と同じ SM121 NVFP4 対応イメージ(vLLM 0.23.0。モデル側の要件 >=0.19 を満たす)。
    # モデルは unsloth/Qwen3.6-27B-NVFP4(vision を保持。MTP 重みも同梱とされる)。
    image: ghcr.io/aeon-7/aeon-vllm-ultimate:2026-06-18-v0.23.0-dflashfix
    container_name: vllm-qwen27b
    entrypoint: ["vllm"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_USAGE_SOURCE=production
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
      - RAY_USAGE_STATS_ENABLED=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_CUDA_ARCH_LIST=12.1a
      - ENABLE_NVFP4_SM100=0
      - VLLM_NVFP4_GEMM_BACKEND=flashinfer-cutlass
      - NVIDIA_FORWARD_COMPAT=1
      - CUTE_DSL_ARCH=sm_121a
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - MAX_JOBS=1
      - FLASHINFER_JIT_MAX_PARALLEL_COMPILE=1
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${MODELS_DIR:-~/models}:/models
      - ./.cache/flashinfer:/root/.cache/flashinfer
      - ./.cache/vllm:/root/.cache/vllm
    ports:
      - "127.0.0.1:${HOST_PORT}:8000"
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
    command:
      - serve
      - unsloth/Qwen3.6-27B-NVFP4
      - --served-model-name=Qwen/Qwen3.6-27B
      - --tensor-parallel-size=1
      - --max-model-len=${MAX_MODEL_LEN}
      - --max-num-seqs=${MAX_NUM_SEQS}
      - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION}
      - --max-num-batched-tokens=8192
      - --trust-remote-code
      - --host=0.0.0.0
      - --port=8000
      - --dtype=auto
      - --kv-cache-dtype=fp8
      - --attention-backend=flashinfer
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      # MTP は指定していない(素の起動構成)。
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 1200s
    restart: "no"
